name: Feature Branches CI/CD Workflow

permissions:
  contents: write
  deployments: write
  actions: write

on:
  push:
    branches:
      - "SEP490-*"
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "android/**"
      - "ios/**"
      - "scripts/**"
      - ".github/workflows/feature-workflow.yml"
      - ".github/workflows/deploy-workflow.yml"
      - ".github/actions/**"

jobs:
  cancel_stale_dev_deploys:
    name: Cancel Pending-Approval Dev Deploys
    runs-on: ubuntu-latest
    steps:
      - name: Cancel dev build jobs still waiting on approval from older runs on this branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');

            const { data: runsData } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'feature-workflow.yml',
              branch,
              event: 'push',
              per_page: 50,
            });

            const staleRuns = runsData.workflow_runs.filter(
              (run) => run.id !== context.runId && run.status !== 'completed',
            );

            for (const run of staleRuns) {
              const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });

              // Only act if the run's dev-build job is stuck behind manual environment
              // approval ("waiting"). Runs whose build job is "queued" (runner about to
              // pick it up) or "in_progress" (already building) must never be touched.
              // The GitHub API has no per-job cancel endpoint, only per-run — but a job can
              // only be "waiting" on approval after its own `needs` are satisfied, so
              // code_quality is guaranteed complete by then and cancelling the whole run
              // here only interrupts the pending-approval build, nothing else.
              const isPendingApproval = jobsData.jobs.some(
                (job) => job.name.startsWith('Build Dev App') && job.status === 'waiting',
              );

              if (isPendingApproval) {
                console.log(`Cancelling run #${run.id} — its dev build is still waiting on approval`);
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                } catch (error) {
                  console.log(`Failed to cancel run #${run.id}: ${error.message}`);
                }
              }
            }

  code_quality:
    name: Verify Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Project
        uses: ./.github/actions/setup-project

      - name: Static Check
        run: |
          dart format --output=none --set-exit-if-changed . || {
            echo "=========================================================================" >&2
            echo "❌ CODE FORMAT CHECK FAILED!" >&2
            echo "👉 Some files in your commit do not follow the project's formatting rules." >&2
            echo "💡 FIX: Run the following command on your local machine to auto-format:" >&2
            echo "   dart format ." >&2
            echo "👉 Once done, stage the changes, commit, and push again. Thank you!" >&2
            echo "=========================================================================" >&2
            exit 1
          }

          flutter analyze

  build_dev:
    name: Build Dev App
    needs: code_quality
    uses: ./.github/workflows/build-workflow.yml
    with:
      environment: dev
    secrets: inherit
