name: fe
description: "POMS - Post-Operative Monitoring System Mobile App"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^15.1.2

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Network
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  # Local storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Utilities
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  equatable: ^2.0.7

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  json_serializable: ^6.9.5
  freezed: ^2.5.8
  freezed_annotation: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - .env
