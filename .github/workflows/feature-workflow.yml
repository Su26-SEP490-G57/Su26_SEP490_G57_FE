name: Feature Branches CI/CD Workflow

on:
  push:
    branches:
      - "SEP490-*"
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "android/**"
      - "ios/**"
      - "scripts/**"
      - ".github/workflows/feature-workflow.yml"
      - ".github/workflows/deploy-workflow.yml"
      - ".github/actions/**"

jobs:
  code_quality:
    name: Verify Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Project
        uses: ./.github/actions/setup-project

      - name: Static Check
        run: |
          dart format --output=none --set-exit-if-changed . || {
            echo "=========================================================================" >&2
            echo "❌ CODE FORMAT CHECK FAILED!" >&2
            echo "👉 Some files in your commit do not follow the project's formatting rules." >&2
            echo "💡 FIX: Run the following command on your local machine to auto-format:" >&2
            echo "   dart format ." >&2
            echo "👉 Once done, stage the changes, commit, and push again. Thank you!" >&2
            echo "=========================================================================" >&2
            exit 1
          }

          flutter analyze

  build_dev:
    name: Build Dev App
    needs: code_quality
    uses: ./.github/workflows/build-workflow.yml
    with:
      environment: dev
    secrets: inherit
