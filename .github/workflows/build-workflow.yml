name: Build Workflow

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the environment to build the APK for"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      release_notes:
        description: "Optional release notes to publish in version.json for this build"
        required: false
        default: ""
        type: string

  workflow_call:
    inputs:
      environment:
        description: "Select the environment to build the APK for"
        required: true
        type: string
      release_notes:
        description: "Optional release notes to publish in version.json for this build"
        required: false
        default: ""
        type: string

jobs:
  auto_approve:
    name: Auto Approve If Manual Trigger
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Auto Approve If Manual Trigger
        uses: activescott/automate-environment-deployment-approval@v1.0.6
        with:
          github_token: ${{ secrets.AUTO_APPROVE_TOKEN }}
          environment_allow_list: |
            dev
          actor_allow_list: |
            WhiteAngel2406
            BinhH12
            fonghtdev
            giangdoit123
            lucif3r2003

  build_apk:
    name: Build APK (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    # 🚦 Maintain a sequential build queue per environment to protect server and build resources
    concurrency:
      group: poms-android-build-${{ inputs.environment }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Project
        uses: ./.github/actions/setup-project

      - name: Compute App Versioning
        id: versioning
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            VERSION_NAME="1.0.0"
          else
            VERSION_NAME="0.1.0"
          fi

          # github.run_number is scoped per workflow *file*, so it drifts between the
          # two ways this workflow can run (workflow_dispatch vs. workflow_call from
          # feature/main-workflow) and produces mismatched/non-monotonic codes for the
          # same environment. Use seconds since a fixed epoch instead, which stays
          # monotonic and consistent across both trigger paths with no shared state.
          # Base epoch 1704067200 = 2024-01-01T00:00:00Z, keeping the value well under
          # Android's 2,100,000,000 versionCode ceiling for ~66 years.
          BASE_EPOCH=1704067200
          VERSION_CODE=$(( $(date -u +%s) - BASE_EPOCH ))

          echo "🚀 [Versioning] Target Env: ${{ inputs.environment }} | Name: v$VERSION_NAME | Code: +$VERSION_CODE"

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Build APK
        run: |
          # --obfuscate/--split-debug-info cost real R8 whole-program-analysis
          # time on top of the normal build — only pay for it (and get
          # symbolicatable crash traces) on prod. dev/staging build faster and
          # don't produce a build/app/outputs/symbols dir at all.
          OBFUSCATE_FLAGS=""
          if [ "${{ inputs.environment }}" = "prod" ]; then
            OBFUSCATE_FLAGS="--obfuscate --split-debug-info=build/app/outputs/symbols"
          fi

          flutter build apk \
            --flavor ${{ inputs.environment }} \
            --build-name="${{ steps.versioning.outputs.version_name }}" \
            --build-number="${{ steps.versioning.outputs.version_code }}" \
            --dart-define=FLAVOR=${{ inputs.environment }} \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} \
            --dart-define=API_RECEIVE_TIMEOUT=${{ vars.API_RECEIVE_TIMEOUT }} \
            --dart-define=API_CONNECT_TIMEOUT=${{ vars.API_CONNECT_TIMEOUT }} \
            $OBFUSCATE_FLAGS \
            -t lib/main_${{ inputs.environment }}.dart

      - name: Prepare APK Files (Versioned & Latest)
        id: prepare_apks
        run: |
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          ENV="${{ inputs.environment }}"
          V_NAME="${{ steps.versioning.outputs.version_name }}"
          V_CODE="${{ steps.versioning.outputs.version_code }}"
          APK_DIR="build/app/outputs/flutter-apk"

          ORIGINAL_FILE="$APK_DIR/app-$ENV-release.apk"

          VERSIONED_NAME="poms-$ENV-v$V_NAME+$V_CODE-$SHORT_SHA.apk"
          VERSIONED_PATH="$APK_DIR/$VERSIONED_NAME"
          mv "$ORIGINAL_FILE" "$VERSIONED_PATH"

          LATEST_NAME="poms-$ENV-latest.apk"
          LATEST_PATH="$APK_DIR/$LATEST_NAME"
          cp "$VERSIONED_PATH" "$LATEST_PATH"

          echo "versioned_apk_path=$VERSIONED_PATH" >> $GITHUB_OUTPUT
          echo "versioned_apk_name=$VERSIONED_NAME" >> $GITHUB_OUTPUT
          echo "latest_apk_path=$LATEST_PATH" >> $GITHUB_OUTPUT
          echo "latest_apk_name=$LATEST_NAME" >> $GITHUB_OUTPUT

      # 📦 STEP 1: Create a unique, version-specific GitHub Release (For historic tracking)
      - name: Create Versioned GitHub Release
        id: create_versioned_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ENV="${{ inputs.environment }}"
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)

          FILE_PATH="${{ steps.prepare_apks.outputs.versioned_apk_path }}"
          FILE_NAME="${{ steps.prepare_apks.outputs.versioned_apk_name }}"

          V_NAME="${{ steps.versioning.outputs.version_name }}"
          V_CODE="${{ steps.versioning.outputs.version_code }}"
          TAG_NAME="poms-$ENV-v$V_NAME-build.$V_CODE"
          RELEASE_TITLE="POMS $ENV Build - v$V_NAME+$V_CODE"

          BUILD_TIME=$(date -d '+7 hours' +'%Y-%m-%d %H:%M:%S (ICT)')

          NOTE_CONTENT=$(cat <<EOF
          ### 📱 POMS Mobile Build Information

          | Attribute | Details |
          | :--- | :--- |
          | **Environment** | \`$ENV\` |
          | **Version** | \`v$V_NAME+$V_CODE\` |
          | **Build Branch** | \`${{ github.ref_name }}\` |
          | **Commit SHA** | [\`$SHORT_SHA\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | **Build Time** | \`$BUILD_TIME\` |

          ---
          *This release was automatically generated by the CI/CD pipeline.*
          EOF
          )

          # Create the unique historical release
          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTE_CONTENT" \
            --prerelease

          gh release upload "$TAG_NAME" "$FILE_PATH#$FILE_NAME"

          echo "✅ [History] Versioned release $TAG_NAME created successfully!"

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      # 🧩 Package & upload debug symbols — needed to symbolicate obfuscated crash
      # traces from this exact build (--obfuscate strips readable stack traces,
      # --split-debug-info writes the matching symbols here). Attached only to the
      # versioned (historical) release, never "latest" — "latest" gets deleted and
      # recreated on every build (see STEP 2 below), which would destroy older
      # symbols needed to debug a crash reported against a version that's no
      # longer latest. prod-only: dev/staging skip --obfuscate/--split-debug-info
      # (see Build APK step), so there's no symbols dir to package for them.
      - name: Package & Upload Debug Symbols
        if: inputs.environment == 'prod'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ENV="${{ inputs.environment }}"
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          V_NAME="${{ steps.versioning.outputs.version_name }}"
          V_CODE="${{ steps.versioning.outputs.version_code }}"
          TAG_NAME="${{ steps.create_versioned_release.outputs.tag_name }}"

          SYMBOLS_DIR="build/app/outputs/symbols"
          ARCHIVE_NAME="poms-$ENV-v$V_NAME+$V_CODE-$SHORT_SHA-symbols.tar.gz"

          tar -czf "$ARCHIVE_NAME" -C "$SYMBOLS_DIR" .

          gh release upload "$TAG_NAME" "$ARCHIVE_NAME"

          echo "✅ [Symbols] Uploaded $ARCHIVE_NAME to $TAG_NAME"

      # 🚀 STEP 2: Re-publish and "re-create" the 'latest' Release (To force it to the top of the feed)
      - name: Update and Force Top Latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ENV="${{ inputs.environment }}"
          LATEST_TAG="$ENV-latest"
          LATEST_FILE_PATH="${{ steps.prepare_apks.outputs.latest_apk_path }}"
          LATEST_FILE_NAME="${{ steps.prepare_apks.outputs.latest_apk_name }}"

          V_NAME="${{ steps.versioning.outputs.version_name }}"
          V_CODE="${{ steps.versioning.outputs.version_code }}"
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          BUILD_TIME=$(date -d '+7 hours' +'%Y-%m-%d %H:%M:%S (ICT)')

          echo "🔄 Regenerating Release $LATEST_TAG to force-push it to the top of the page..."

          # Delete the old 'latest' release and tag to reset its creation timestamp
          gh release delete "$LATEST_TAG" --yes --cleanup-tag || true

          # Small delay to ensure GitHub API registers the deletion cleanly
          sleep 2

          LATEST_NOTE=$(cat <<EOF
          ### 🚀 POMS Mobile Latest Download
          This is the fast-download link for the most recent **$ENV** build. 
          It directly mirrors the stable target **v$V_NAME+$V_CODE**.

          | Build Metadata | Details |
          | :--- | :--- |
          | **Environment** | \`$ENV\` |
          | **Original Version** | \`v$V_NAME+$V_CODE\` |
          | **Source Branch** | \`${{ github.ref_name }}\` |
          | **Commit SHA** | [\`$SHORT_SHA\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | **Last Updated** | \`$BUILD_TIME\` |

          ---
          *The APK download link below remains static and will never change.*
          EOF
          )

          # Re-create the 'latest' release (New timestamp makes it jump to the top of the Releases page)
          gh release create "$LATEST_TAG" \
            --title "POMS ${ENV^^} - LATEST BUILD" \
            --notes "$LATEST_NOTE" \
            --prerelease

          gh release upload "$LATEST_TAG" "$LATEST_FILE_PATH#$LATEST_FILE_NAME"

          echo "🎉 [Latest] Successfully ginned and forced $LATEST_TAG to the top of the Releases page!"

      # 📄 STEP 3: Generate this environment's version.json (fetch-merge-reupload so an
      # Android-only build never clobbers a future `ios` block in the same file).
      # Served at /var/www/poms-mobile/versions/<env>/version.json — the environment
      # is expressed via the directory now, not a version-<env>.json filename.
      - name: Generate version.json
        id: generate_version_json
        run: |
          ENV="${{ inputs.environment }}"
          V_NAME="${{ steps.versioning.outputs.version_name }}"
          V_CODE="${{ steps.versioning.outputs.version_code }}"
          DOMAIN_NAME="${{ vars.DOMAIN_NAME }}"
          RELEASE_NOTES="${{ inputs.release_notes }}"

          MIN_SUPPORTED_VERSION_CODE="${{ vars.MIN_SUPPORTED_VERSION_CODE }}"
          MIN_SUPPORTED_VERSION_CODE="${MIN_SUPPORTED_VERSION_CODE:-1}"

          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/$ENV-latest/poms-$ENV-latest.apk"
          UPDATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          echo "📥 [Version] Fetching currently-published version.json for '$ENV' (if any)..."
          CURRENT_JSON=$(curl -f -s "https://api-$ENV.$DOMAIN_NAME/version.json" || echo '{}')
          if [ -z "$CURRENT_JSON" ]; then
            CURRENT_JSON='{}'
          fi

          jq -n \
            --arg versionName "$V_NAME" \
            --argjson versionCode "$V_CODE" \
            --arg downloadUrl "$DOWNLOAD_URL" \
            --argjson minSupportedVersionCode "$MIN_SUPPORTED_VERSION_CODE" \
            --arg releaseNotes "$RELEASE_NOTES" \
            --arg updatedAt "$UPDATED_AT" \
            '{
              versionName: $versionName,
              versionCode: $versionCode,
              minSupportedVersionCode: $minSupportedVersionCode,
              forceUpdate: false,
              downloadUrl: $downloadUrl,
              releaseNotes: (if $releaseNotes == "" then null else $releaseNotes end),
              updatedAt: $updatedAt
            } | with_entries(select(.value != null))' > android.json

          echo "$CURRENT_JSON" | jq --argjson android "$(cat android.json)" \
            '.schemaVersion = 1 | .android = $android' > "version.json"

          echo "----- version.json ($ENV) -----"
          cat "version.json"

          echo "version_json_path=version.json" >> $GITHUB_OUTPUT

      - name: Write SSH Deploy Key
        run: |
          umask 077
          cat > /tmp/poms_ssh_deploy_key <<'EOF'
          ${{ secrets.SSH_KEY }}
          EOF

      - name: Upload version.json via SSH
        uses: ./.github/actions/retry-scp
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key_path: /tmp/poms_ssh_deploy_key
          source: "${{ steps.generate_version_json.outputs.version_json_path }}"
          target: "/var/www/poms-mobile/versions/${{ inputs.environment }}/"
